name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        run: sdkmanager "build-tools;34.0.0"

      # Grant execution permission to the gradlew wrapper script
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Switched to assembleRelease for optimized production compilation
      - name: Build release APK
        run: ./gradlew :watch:assembleRelease

      # Securely decode and sign the compiled release APK
      - name: Decode and Sign Android APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: watch/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # Stages the securely signed file with your clean asset naming scheme
      - name: Stage APK under a clean asset name
        run: cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "dieselbridge-${GITHUB_REF_NAME#v}.apk"

      # Updated the notes to accurately reflect that the app is now securely release-signed
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="dieselbridge-${GITHUB_REF_NAME#v}.apk"
          NOTES="WearOS bridge for use with Gadgetbridge. The attached APK is **release-signed** — sideload onto your Wear OS watch (like the Diesel DW9D1) with \`adb install -r\`. Requires unmodified Gadgetbridge on the phone (It'll appear as a Bangle.js device)."

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" --title "DieselBridge $GITHUB_REF_NAME" --notes "$NOTES"
          fi